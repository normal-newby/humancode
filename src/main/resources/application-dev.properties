# Development profile: the curated bank, no generation, no spend.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Use this while working on anything that is not problem generation. Sessions
# start instantly, the problems are the same every time, and their expectations
# are machine-verified by `cd web && npm run check:problems`.
#
# The default (no profile) generates a fresh problem per session and costs a
# model call per session started — see application.properties.
humancode.problems.source=bank
humancode.problems.pool-size=0

# The bank covers easy, medium and hard, so the difficulty picker works offline
# too — it just picks from four problems instead of writing a new one.
