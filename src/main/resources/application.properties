spring.application.name=humancode
server.port=8080

spring.config.import=optional:file:.env[.properties]

# --- Persistence: SQLite -----------------------------------------------------
# The dialect ships in org.hibernate.orm:hibernate-community-dialects, not in
# the xerial JDBC driver. Without it Hibernate cannot bootstrap.
spring.datasource.url=jdbc:sqlite:./data/humancode.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQLite allows exactly one writer. A larger pool buys nothing and earns you
# intermittent SQLITE_BUSY under the telemetry write path.
spring.datasource.hikari.maximum-pool-size=1

# --- SSE ---------------------------------------------------------------------
# An interview session's event stream outlives the default async timeout.
# -1 disables it; per-emitter timeouts are set in code.
spring.mvc.async.request-timeout=-1

# --- OpenAI ------------------------------------------------------------------
# The SDK reads OPENAI_API_KEY from the environment via OpenAIOkHttpClient.fromEnv().
# This property is an optional override; leave it unset and export the env var.
humancode.ai.api-key=${OPENAI_API_KEY:}

# Verify both IDs against what the hackathon credits actually cover before the
# first run, and swap here rather than in code.
#
# Deliberate path: problem generation, hints, report card. On gpt-5-mini for
# latency. These stay two separate properties even while they hold the same
# value, because they are two different jobs: see the note in CLAUDE.md §5 on
# what moving the report card off gpt-5 costs, and flip this one back if
# verdicts start being confidently wrong about working code.
humancode.ai.model=gpt-5-mini
# Quip path: reactive one-liners. Must feel instant, fires often.
humancode.ai.quip-model=gpt-5-mini
humancode.ai.request-timeout=30s
# The report card reasons over the finished files, so it runs past the client-wide
# timeout above. Applied per request; a short one here retries rather than fails.
humancode.ai.report-timeout=120s

# --- Problems ----------------------------------------------------------------
# generated : the model writes a fresh problem, with its own runnable tests, per
#             session. Requires OPENAI_API_KEY; falls back to the bank (loudly)
#             if generation is unavailable or returns something malformed.
# bank      : the curated JSON problems in resources/problems. Repeatable and
#             hand-verified, and it costs nothing. Run with
#             -Dspring-boot.run.profiles=dev to get it.
humancode.problems.source=generated

# Problems kept warm by ProblemPool so the ~40s generation call never happens in
# front of the begin button. This is PER DIFFICULTY, because the candidate picks
# one: at 1, three problems stay warm and a first run makes three calls. 0
# disables the pool and generates inline, blocking.
#
# The pool is written to disk and restored on the next boot, so only a first run
# (or a deleted cache) is cold. A cold pool falls back to bank problems and says
# so; wait for "Pool now holds 2 problem(s)" before starting a session.
humancode.problems.pool-size=1

# Per-request deadline for one generation. The client-wide timeout above does
# not fail a slow call, it retries it, which bills the same problem two or three
# times. Keep this well clear of how long a generation actually takes.
humancode.problems.generation-timeout=180s

# Where the warm pool is kept between restarts. Gitignored with the rest of
# ./data. Delete it to force fresh problems; blank disables the cache.
humancode.problems.cache-file=./data/problem-pool.json

# --- Speech (ElevenLabs) -----------------------------------------------------
# No key means a silent app, not a broken one — same rule as the OpenAI key.
humancode.speech.api-key=${ELEVENLABS_API_KEY:}

# One voice for the whole session. Mood changes the delivery, never the voice:
# two lines a beat apart have to read as one person changing their mind.
# Swap this for any voice id from your ElevenLabs library.
humancode.speech.voice-id=Dz2iUq9CIbeuy8tZeZ7Z

# KEEP THIS ON A v3 MODEL. The angry end of the meter yells by prefixing the
# line with an audio tag ([shouting], [annoyed]), which only v3 interprets as
# performance — turbo and flash read the bracket out loud as the word.
# SpeechService drops the tags when it sees a non-v3 model, so the failure is
# "no longer shouts" rather than "says shouting", but you lose the feature.
humancode.speech.model=eleven_v3

# Run silent without touching .env — useful when a demo does not want audio.
humancode.speech.enabled=true

# How long ElevenLabs gets for one synthesis before the call is abandoned.
#
# THIS IS THE OUTER BOUND, NOT PACING, and it is sized for the slowest thing
# the app ever synthesises: the problem statement, a paragraph rather than a
# line, measured at 6.3 / 6.4 / 6.6 / 6.8 / 7.6 seconds. It was 8s, which left
# 400ms of margin on the slowest of those and produced intermittent
# "Speech failed ... HttpTimeoutException" — a silent statement, at random.
#
# What bounds the wait the candidate actually experiences is elsewhere and
# much shorter: SpeechController.WAIT (12s) caps how long a browser request is
# held, and App's MAX_COMPOSING_MS (3s) caps how long a line is held back for
# its audio. Raising this one only stops the call being killed mid-flight.
humancode.speech.request-timeout=30s

# Clips held in memory at once, evicted oldest-first. Not a cache anyone reads
# twice — a leak stop.
humancode.speech.max-clips=64

# --- Interview tuning --------------------------------------------------------
humancode.interview.idle-threshold=20s
# Caps routine code-change and test-run reactions. First implementation and
# suspicious pastes may bypass it once to keep the interviewer responsive.
humancode.interview.quip-cooldown=8s
humancode.interview.telemetry-batch-window=1500ms
# How far in, and how much written, before the curveball may fire. Once per
# session — see TriggerEngine.
humancode.interview.curveball-delay=90s
humancode.interview.curveball-min-chars=40

# --- Logging -----------------------------------------------------------------
logging.level.com.example.humancode.ai=DEBUG
logging.level.com.example.humancode.telemetry=DEBUG
logging.level.com.example.humancode.speech=DEBUG
