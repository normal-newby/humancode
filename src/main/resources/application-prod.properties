# Production profile. Activate it, do not edit application.properties:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#   java -jar target/humancode-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
#   SPRING_PROFILES_ACTIVE=prod java -jar ...
#
# Requires OPENAI_API_KEY. Without it every session silently falls back to the
# curated bank and GeneratedProblemSource logs an error at startup — check for
# that line before trusting a prod run.
#
# The pool takes about a minute per problem to warm. Sessions started before it
# is warm get a bank problem and log a warning. Start the server first.

# --- Problems ----------------------------------------------------------------
# Generated problems are the default now (see application.properties), so this
# profile only restates it for the record and keeps a deeper pool: two warm per
# difficulty, so a prod server is ready for two candidates who pick the same
# level back to back. Six problems, generated once and cached to disk.
humancode.problems.source=generated
humancode.problems.pool-size=2

# --- Logging -----------------------------------------------------------------
# Dev runs the ai and telemetry packages at DEBUG, which prints per-call token
# usage and every trigger evaluation. That is noise in prod, but keep INFO: the
# interviewer's lines, the generation results and the fallback warnings are all
# logged at INFO and they are what you read when a session goes strange.
logging.level.com.example.humancode=INFO
logging.level.com.example.humancode.ai=INFO
logging.level.com.example.humancode.telemetry=INFO

# --- Serving -----------------------------------------------------------------
# The Monaco bundle is the bulk of the page and compresses well.
# text/event-stream is deliberately NOT in this list: compressing the session
# stream buffers it, and a buffered SSE channel is an interviewer that never
# speaks.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Nothing internal in an error body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Behind a proxy or tunnel, honour the forwarded scheme and host so the SSE URL
# the browser was given keeps working.
server.forward-headers-strategy=framework

# --- Persistence -------------------------------------------------------------
# Still SQLite, still single-writer (see the pool size in application.properties).
# The schema is created on first boot; ./data must be writable by whoever runs
# the jar.
spring.jpa.hibernate.ddl-auto=update
